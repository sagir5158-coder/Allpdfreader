<!DOCTYPE html>
<html lang="hi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessible PDF & Document Reader All-in-One</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --border: #cbd5e1;
      --focus-ring: #ea580c;
      --highlight-bg: #fef08a;
      --secondary-btn: #475569;
    }
    [data-theme="dark"] {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --border: #334155;
      --focus-ring: #f97316;
      --highlight-bg: #854d0e;
      --secondary-btn: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; padding: 16px; max-width: 900px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid var(--border); padding-bottom: 12px; }
    h1 { font-size: 1.4rem; }
    .top-actions { display: flex; gap: 8px; }
    .panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .field-group { margin-bottom: 14px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    select, input[type="file"], input[type="text"], button { width: 100%; padding: 10px 14px; font-size: 1rem; border: 1px solid var(--border); border-radius: 6px; background: var(--card-bg); color: var(--text); }
    button { cursor: pointer; font-weight: bold; }
    select:focus-visible, input:focus-visible, button:focus-visible, textarea:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 2px; }
    .slider-container { display: flex; align-items: center; gap: 12px; }
    .slider-container input[type="range"] { flex: 1; height: 24px; }
    .slider-val { min-width: 35px; font-weight: bold; }
    .controls-grid { display: grid; grid-template-columns: 1fr 1.5fr 1fr; gap: 10px; margin-top: 10px; }
   

 .btn { background: var(--primary); color: #ffffff; border: none; }
    .btn:hover { background: var(--primary-hover); }
    .btn-secondary { background: var(--secondary-btn); color: #ffffff; border: none; }
    .btn:disabled, .btn-secondary:disabled { background: #94a3b8; cursor: not-allowed; }
    #status { font-weight: 600; min-height: 24px; margin-bottom: 10px; color: var(--primary); }
    textarea { width: 100%; height: 200px; padding: 12px; border: 1px solid var(--border); border-radius: 6px; resize: vertical; font-size: 1.05rem; font-family: inherit; background: var(--card-bg); color: var(--text); }
    details { margin-bottom: 12px; border: 1px solid var(--border); border-radius: 6px; padding: 10px; }
    details summary { cursor: pointer; font-weight: bold; font-size: 1rem; }
    .dict-container, .tool-grid { display: flex; gap: 8px; margin-top: 8px; }
    .dict-output { margin-top: 8px; padding: 10px; border-radius: 4px; border: 1px solid var(--border); }
    .list-box { max-height: 120px; overflow-y: auto; border: 1px solid var(--border); border-radius: 4px; margin-top: 8px; padding: 6px; }
    .list-item { padding: 4px 8px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
    .list-item:last-child { border-bottom: none; }
    .list-btn { padding: 2px 6px; font-size: 0.8rem; width: auto; }
    .inline-btns { display: flex; gap: 8px; margin-top: 8px; }
  </style>
</head>
<body>
  <header>
    <h1 id="txtTitle">एक्सेसिबल रीडर ऑल-इन-वन</h1>
    <div class="top-actions">
      <button id="themeToggleBtn" class="btn-secondary" style="width: auto; padding: 6px 12px;" onclick="toggleTheme()">डार्क मोड</button>
      <button id="langToggleBtn" class="btn-secondary" style="width: auto; padding: 6px 12px;" onclick="toggleUILang()">English</button>
    </div>
  </header>

  <main>
    <div class="panel">
      <div class="field-group">
        <label id="lblFile" for="fileInput">दस्तावेज़ चुनें (PDF, DOCX, TXT, PNG, JPG, WEBP):</label>
        <input type="file" id="fileInput" accept=".pdf,.docx,.txt,image/*" aria-label="फ़ाइल चुनें">
      </div>
      <div id="status" role="status" aria-live="polite">फ़ाइल लोड करने के लिए तैयार...</div>
    </div>

    <div class="panel">
      <label id="lblContent" for="docContent">दस्तावेज़ का टेक्स्ट:</label>
      <textarea id="docContent" placeholder="दस्तावेज़ से निकाला गया टेक्स्ट यहाँ दिखाई देगा..."></textarea>
      
      <div class="inline-btns">
 

       <button id="btnHighlight" class="btn-secondary" onclick="addHighlight()">चयनित टेक्स्ट हाइलाइट करें</button>
        <button id="btnBookmark" class="btn-secondary" onclick="addBookmark()">बुकमार्क जोड़ें</button>
      </div>

      <div class="list-box" id="bookmarkList" aria-label="बुकमार्क सूची">
        <span id="txtNoBookmarks" style="font-size:0.9rem; color:#64748b;">कोई बुकमार्क उपलब्ध नहीं है।</span>
      </div>
    </div>

    <div class="panel">
      <h2 id="lblControls" style="font-size: 1.1rem; margin-bottom: 8px;">प्लेबैक कंट्रोल्स</h2>
      <div class="controls-grid">
        <button id="btnRewind" class="btn" onclick="rewindSpeech()" aria-label="पीछे जाएं">⏪ -10s</button>
        <button id="btnPlayPause" class="btn" onclick="togglePlayPause()" aria-label="चलाएं या रोकें">▶️ प्ले</button>
        <button id="btnForward" class="btn" onclick="forwardSpeech()" aria-label="आगे जाएं">⏩ +10s</button>
      </div>
    </div>

    <details class="panel">
      <summary id="sumSettings">⚙️ सेटिंग्स (TTS, भाषा व गति)</summary>
      <div style="margin-top: 12px;">
        <div class="field-group">
          <label id="lblLangSelect" for="langSelect">टेक्स्ट-टू-स्पीच भाषा:</label>
          <select id="langSelect" onchange="populateVoices()">
            <option value="hi-IN" selected>हिन्दी (Hindi)</option>
            <option value="en-IN">English (India)</option>
            <option value="mr-IN">मराठी (Marathi)</option>
            <option value="pa-IN">ਪੰਜਾਬੀ (Punjabi)</option>
            <option value="ur-IN">اردو (Urdu)</option>
            <option value="ar-SA">العربية (Arabic)</option>
            <option value="bn-IN">বাংলা (Bengali)</option>
            <option value="bho">भोजपुरी (Bhojpuri - Fallback Hindi TTS)</option>
            <option value="bgc">हरियाणवी (Haryanvi - Fallback Hindi TTS)</option>
          </select>
        </div>
        <div class="field-group">
          <label id="lblVoiceSelect" for="voiceSelect">सिस्टम वॉइस:</label>
          <select id="voiceSelect"></select>
        </div>
        <div class="field-group">
          <label id="lblRate" for="rate">गति (Speed):</label>
          <div class="slider-container">
            <input type="range" id="rate" min="0.5" max="2" value="1" step="0.1" oninput="updateRateLabel(this.value)">
            <span class="slider-val" id="rateVal">1.0x</span>
          </div>
        </div>
      </div>
    </details>

    <details class="panel">
      <summary

 id="sumDict">📖 डिक्शनरी लुकअप</summary>
      <div class="dict-container">
        <input type="text" id="dictInput" placeholder="शब्द दर्ज करें (जैसे: accessibility)..." aria-label="डिक्शनरी शब्द">
        <button id="btnDictLookup" class="btn" style="width: auto;" onclick="lookupWord()">खोजें</button>
      </div>
      <div id="dictOutput" class="dict-output" style="display: none;" role="region" aria-live="polite"></div>
    </details>

    <details class="panel">
      <summary id="sumCloud">☁️ क्लाउड स्टोरेज सिंक (सिमुलेशन / इंटरफेस)</summary>
      <div style="margin-top: 8px;">
        <p id="txtCloudStatus" style="font-size:0.9rem; margin-bottom: 8px;">दस्तावेज़ और बुकमार्क्स को क्लाउड स्टोरेज से सिंक करें。</p>
        <div class="inline-btns">
          <button id="btnCloudSave" class="btn-secondary" onclick="syncSave()">क्लाउड पर सेव करें</button>
          <button id="btnCloudLoad" class="btn-secondary" onclick="syncLoad()">क्लाउड से लोड करें</button>
        </div>
      </div>
    </details>
  </main>

  <script>
    if (typeof pdfjsLib !== 'undefined') {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    }

    let isPlaying = false;
    let isPaused = false;
    let speechWords = [];
    let currentWordIndex = 0;
    let bookmarks = [];
    let currentTheme = 'light';
    let currentLang = 'hi';

    const translations = {
      hi: {
        title: "एक्सेसिबल रीडर ऑल-इन-वन",
        themeDark: "डार्क मोड",
        themeLight: "लाइट मोड",
        fileLabel: "दस्तावेज़ चुनें (PDF, DOCX, TXT, PNG, JPG, WEBP):",
        fileReady: "फ़ाइल लोड करने के लिए तैयार...",
        docContent: "दस्तावेज़ का टेक्स्ट:",
        placeholderText: "दस्तावेज़ से निकाला गया टेक्स्ट यहाँ दिखाई देगा...",
        btnHighlight: "चयनित टेक्स्ट हाइलाइट करें",
        btnBookmark: "बुकमार्क जोड़ें",
        noBookmarks: "कोई बुकमार्क उपलब्ध नहीं है।",
        controls: "प्लेबैक कंट्रोल्स",
        play: "▶️ प्ले",
        pause: "⏸️ पॉज़",
        settings: "⚙️ सेटिंग्स (TTS, भाषा व गति)",
        langSelect: "टेक्स्ट-टू-स्पीच भाषा:",
        voiceSelect: "सिस्टम वॉइस:",
        rate: "गति (Speed):",
        dictSummary: "📖 डिक्शनरी लुकअप",
        dictPlaceholder: "शब्द दर्ज करें...",
        dictLookupBtn: "खोजें",
        cloudSummary: "☁️ क्लाउड स्टोरेज सिंक (सिमुलेशन / इंटरफेस)",
        cloudDesc: "दस्तावेज़ और बुकमार्क्स को क्लाउड स्टोरेज से सिंक करें。",
        cloudSave: "क्लाउड

 पर सेव करें",
        cloudLoad: "क्लाउड से लोड करें"
      },
      en: {
        title: "Accessible Reader All-in-One",
        themeDark: "Dark Mode",
        themeLight: "Light Mode",
        fileLabel: "Choose Document (PDF, DOCX, TXT, PNG, JPG, WEBP):",
        fileReady: "Ready to load file...",
        docContent: "Extracted Document Text:",
        placeholderText: "Text extracted from the document will appear here...",
        btnHighlight: "Highlight Selected Text",
        btnBookmark: "Add Bookmark",
        noBookmarks: "No bookmarks saved.",
        controls: "Playback Controls",
        play: "▶️ Play",
        pause: "⏸️ Pause",
        settings: "⚙️ Settings (TTS, Language & Speed)",
        langSelect: "Text-to-Speech Language:",
        voiceSelect: "System Voice:",
        rate: "Speed:",
        dictSummary: "📖 Dictionary Lookup",
        dictPlaceholder: "Enter word...",
        dictLookupBtn: "Search",
        cloudSummary: "☁️ Cloud Storage Sync (Interface)",
        cloudDesc: "Sync text and bookmarks with cloud storage.",
        cloudSave: "Save to Cloud",
        cloudLoad: "Load from Cloud"
      }
    };

    function toggleTheme() {
      currentTheme = currentTheme === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', currentTheme);
      document.getElementById('themeToggleBtn').innerText = currentTheme === 'light' ? translations[currentLang].themeDark : translations[currentLang].themeLight;
    }

    function toggleUILang() {
      currentLang = currentLang === 'hi' ? 'en' : 'hi';
      const t = translations[currentLang];
      document.getElementById('txtTitle').innerText = t.title;
      document.getElementById('langToggleBtn').innerText = currentLang === 'hi' ? 'English' : 'हिन्दी';
      document.getElementById('themeToggleBtn').innerText = currentTheme === 'light' ? t.themeDark : t.themeLight;
      document.getElementById('lblFile').innerText = t.fileLabel;
      document.getElementById('lblContent').innerText = t.docContent;
      document.getElementById('docContent').placeholder = t.placeholderText;
      document.getElementById('btnHighlight').innerText = t.btnHighlight;
      document.getElementById('btnBookmark').innerText = t.btnBookmark;
      document.getElementById('lblControls').innerText = t.controls;
      document.getElementById('btnPlayPause').innerText = isPlaying ? t.pause : t.play;
      document.getElementById('sumSettings').innerText = t.settings;
     

 document.getElementById('lblLangSelect').innerText = t.langSelect;
      document.getElementById('lblVoiceSelect').innerText = t.voiceSelect;
      document.getElementById('lblRate').innerText = t.rate;
      document.getElementById('sumDict').innerText = t.dictSummary;
      document.getElementById('dictInput').placeholder = t.dictPlaceholder;
      document.getElementById('btnDictLookup').innerText = t.dictLookupBtn;
      document.getElementById('sumCloud').innerText = t.cloudSummary;
      document.getElementById('txtCloudStatus').innerText = t.cloudDesc;
      document.getElementById('btnCloudSave').innerText = t.cloudSave;
      document.getElementById('btnCloudLoad').innerText = t.cloudLoad;
      renderBookmarks();
    }

    function updateRateLabel(val) {
      document.getElementById('rateVal').innerText = parseFloat(val).toFixed(1) + 'x';
    }

    function populateVoices() {
      const voiceSelect = document.getElementById('voiceSelect');
      const targetLang = document.getElementById('langSelect').value;
      voiceSelect.innerHTML = '';
      const voices = window.speechSynthesis.getVoices();
      
      const langPrefix = (targetLang === 'bho' || targetLang === 'bgc') ? 'hi' : targetLang.split('-')[0];
      const matched = voices.filter(v => v.lang.toLowerCase().startsWith(langPrefix));
      
      if (matched.length > 0) {
        matched.forEach(v => {
          const opt = document.createElement('option');
          opt.value = v.name;
          opt.textContent = `${v.name} (${v.lang})`;
          voiceSelect.appendChild(opt);
        });
      } else {
        voices.forEach(v => {
          const opt = document.createElement('option');
          opt.value = v.name;
          opt.textContent = `${v.name} (${v.lang})`;
          voiceSelect.appendChild(opt);
        });
      }
    }

    if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = populateVoices;
    }

    document.getElementById('fileInput').addEventListener('change', async function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const status = document.getElementById('status');
      const ext = file.name.split('.').pop().toLowerCase();
      status.innerText = `लोड हो रहा है: ${file.name}...`;

      try {
        if (ext === 'txt') {
          const text = await file.text();
          setText(text);
        } else if (ext === 'docx') {
          const arrayBuffer = await

 file.arrayBuffer();
          const result = await mammoth.extractRawText({ arrayBuffer });
          setText(result.value);
        } else if (ext === 'pdf') {
          const arrayBuffer = await file.arrayBuffer();
          const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
          let fullText = '';
          for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const content = await page.getTextContent();
            const pageText = content.items.map(item => item.str).join(' ');
            fullText += pageText + '\n\n';
          }
          setText(fullText);
        } else if (['png', 'jpg', 'jpeg', 'webp', 'bmp'].includes(ext) || file.type.startsWith('image/')) {
          status.innerText = 'OCR द्वारा इमेज से टेक्स्ट निकाला जा रहा है...';
          const { data: { text } } = await Tesseract.recognize(file, 'hin+eng');
          setText(text);
        } else {
          status.innerText = 'समर्थित फ़ाइल प्रारूप नहीं है。';
        }
      } catch (err) {
        status.innerText = `त्रुटि: ${err.message}`;
      }
    });

    function setText(text) {
      document.getElementById('docContent').value = text;
      document.getElementById('status').innerText = 'दस्तावेज़ सफलतापूर्वक प्रोसेस किया गया。';
      stopSpeech();
    }

    function togglePlayPause() {
      if (!isPlaying) {
        startSpeech();
      } else if (isPaused) {
        window.speechSynthesis.resume();
        isPaused = false;
        document.getElementById('btnPlayPause').innerText = translations[currentLang].pause;
      } else {
        window.speechSynthesis.pause();
        isPaused = true;
        document.getElementById('btnPlayPause').innerText = translations[currentLang].play;
      }
    }

    function startSpeech() {
      const text = document.getElementById('docContent').value.trim();
      if (!text) return;
      window.speechSynthesis.cancel();
      
      speechWords = text.split(/\s+/);
      if (currentWordIndex >= speechWords.length) currentWordIndex = 0;
      
      const remainingText = speechWords.slice(currentWordIndex).join(' ');
      const utterance = new SpeechSynthesisUtterance(remainingText);
      
      const selectedVoiceName = document.getElementById('voiceSelect').value;
      const voices = window.speechSynthesis.getVoices();
      const chosenVoice = voices.find(v => v.name === selectedVoiceName);
      if (chosenVoice) utterance.voice = chosenVoice;

     

 utterance.rate = parseFloat(document.getElementById('rate').value) || 1.0;
      
      utterance.onstart = () => {
        isPlaying = true;
        isPaused = false;
        document.getElementById('btnPlayPause').innerText = translations[currentLang].pause;
      };

      utterance.onend = () => {
        stopSpeech();
      };

      utterance.onerror = () => {
        stopSpeech();
      };

      window.speechSynthesis.speak(utterance);
    }

    function stopSpeech() {
      window.speechSynthesis.cancel();
      isPlaying = false;
      isPaused = false;
      currentWordIndex = 0;
      document.getElementById('btnPlayPause').innerText = translations[currentLang].play;
    }

    function rewindSpeech() {
      if (!isPlaying) return;
      currentWordIndex = Math.max(0, currentWordIndex - 25);
      startSpeech();
    }

    function forwardSpeech() {
      if (!isPlaying) return;
      currentWordIndex = Math.min(speechWords.length - 1, currentWordIndex + 25);
      startSpeech();
    }

    function addHighlight() {
      const textarea = document.getElementById('docContent');
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      if (start === end) return;
      const sel = textarea.value.substring(start, end);
      textarea.value = textarea.value.substring(0, start) + `==${sel}==` + textarea.value.substring(end);
      document.getElementById('status').innerText = 'टेक्स्ट हाइलाइट किया गया (==टेक्स्ट== मार्कर द्वारा)。';
    }

    function addBookmark() {
      const textarea = document.getElementById('docContent');
      const pos = textarea.selectionStart;
      const labelText = textarea.value.substring(pos, pos + 25).trim() || `Bookmark at ${pos}`;
      bookmarks.push({ pos, label: labelText });
      renderBookmarks();
      document.getElementById('status').innerText = 'नया बुकमार्क जोड़ा गया。';
    }

    function renderBookmarks() {
      const list = document.getElementById('bookmarkList');
      list.innerHTML = '';
      if (bookmarks.length === 0) {
        list.innerHTML = `<span style="font-size:0.9rem; color:#64748b;">${translations[currentLang].noBookmarks}</span>`;
        return;
      }
      bookmarks.forEach((bm, i) => {
        const item = document.createElement('div');
        item.className = 'list-item';
        item.innerHTML = `
          <span>📍 ${bm.label}</span>
          <button class="btn-secondary list-btn" onclick="jumpToBookmark(${bm.pos})">Go</button>
        `;


        list.appendChild(item);
      });
    }

    function jumpToBookmark(pos) {
      const textarea = document.getElementById('docContent');
      textarea.focus();
      textarea.setSelectionRange(pos, pos);
      document.getElementById('status').innerText = `बुकमार्क स्थिति (${pos}) पर जाया गया。`;
    }

    async function lookupWord() {
      const word = document.getElementById('dictInput').value.trim();
      const output = document.getElementById('dictOutput');
      if (!word) return;
      output.style.display = 'block';
      output.innerText = `शब्द खोजा जा रहा है: "${word}"...`;
      try {
        const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
        if (!res.ok) throw new Error('परिभाषा नहीं मिली');
        const data = await res.json();
        const def = data[0].meanings[0].definitions[0].definition;
        output.innerText = `अर्थ (${word}): ${def}`;
      } catch (e) {
        output.innerText = `परिभाषा उपलब्ध नहीं है या ऑफ़लाइन त्रुटि。`;
      }
    }

    function syncSave() {
      const text = document.getElementById('docContent').value;
      localStorage.setItem('accessible_reader_content', text);
      localStorage.setItem('accessible_reader_bookmarks', JSON.stringify(bookmarks));
      document.getElementById('status').innerText = 'क्लाउड सिंक: डेटा सफलतापूर्वक सिंक व सुरक्षित हुआ。';
    }

    function syncLoad() {
      const savedText = localStorage.getItem('accessible_reader_content');
      const savedBm = localStorage.getItem('accessible_reader_bookmarks');
      if (savedText) document.getElementById('docContent').value = savedText;
      if (savedBm) {
        bookmarks = JSON.parse(savedBm);
        renderBookmarks();
      }
      document.getElementById('status').innerText = 'क्लाउड सिंक: डेटा लोड किया गया。';
    }

    window.addEventListener('DOMContentLoaded', () => {
      populateVoices();
    });
  </script>
</body>
</html>
